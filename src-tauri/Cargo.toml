[package]
name = "tauri-app"
version = "1.2.24"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# `stream`: la subida de clips va por cuerpo troceado (`Body::wrap_stream`) en
# vez de meter el fichero entero en memoria — un recorte de 200 MB lo era.
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
rdev = "0.5"
tauri-plugin-dialog = "2.7.1"
uuid = { version = "1.23.3", features = ["v4"] }
tauri-plugin-process = "2"
log = "0.4.32"
env_logger = "0.11.10"
rand = "0.8"
# Sólo para la subida de clips: `ReaderStream` trocea el fichero y `StreamExt`
# deja contar lo que va saliendo para emitir el progreso.
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
# Copia de seguridad: un ZIP con los JSON de la biblioteca (notas, comentarios,
# momentos revisados) para que sobrevivan a un formateo. Solo deflate: los
# vídeos NO entran en la copia, así que no hace falta ningún otro compresor.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Solo para pruebas: el corpus de partidas se guarda comprimido y los ajustes
# (percentiles por rol, pesos de objetivos) se recalculan desde ahi. No viaja en
# la app.
[dev-dependencies]
flate2 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

# Win32 a pelo para lo que no cubre ninguna crate del arbol: espacio libre del
# disco (GetDiskFreeSpaceExW), geometria de la ventana de League y del monitor
# que la contiene, y si hay algun dispositivo de reproduccion al que enganchar
# el loopback de OBS. Se elige `windows-sys` y no `windows` porque ya viaja en
# el arbol de Tauri (misma version, 0.61) y son declaraciones FFI planas: no
# añade tiempo de compilacion apreciable ni capas COM que aqui no usamos.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }


