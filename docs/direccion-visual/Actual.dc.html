<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #C8AA6E; } a:hover { color: #D9BE85; }
  </style>
</helmet>

<div style="width: 1040px; height: 620px; box-sizing: border-box; overflow: hidden;
     background:
       radial-gradient(75% 52% at 6% -10%, rgba(200,170,110,0.17) 0%, transparent 60%),
       radial-gradient(62% 55% at 97% 0%, rgba(59,169,125,0.14) 0%, transparent 62%),
       radial-gradient(95% 62% at 66% 115%, rgba(155,109,255,0.11) 0%, transparent 60%),
       #070F1F;
     color: #F0E6D2;">

  <div style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 16px; background: linear-gradient(157deg, rgba(29,42,61,0.84) 0%, rgba(29,42,61,0.52) 100%); border-bottom: 1px solid rgba(240,230,210,0.13);">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C8AA6E;">LEAGUERECORDER</span>
  </div>

  <div style="display: grid; grid-template-columns: 168px 1fr; height: 584px;">

    <div style="padding: 16px 12px; background: linear-gradient(180deg, rgba(29,42,61,0.86) 0%, rgba(13,26,46,0.62) 100%); border-right: 1px solid rgba(240,230,210,0.08); display: flex; flex-direction: column; gap: 2px;">
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; color: #A09B8C;">Hoy</div>
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; background: linear-gradient(157deg, rgba(38,51,70,0.88) 0%, rgba(38,51,70,0.58) 100%); color: #F0E6D2;">Biblioteca</div>
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; color: #A09B8C;">Clips</div>
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; color: #A09B8C;">Errores</div>
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; color: #A09B8C;">Patrones</div>
      <div style="padding: 8px 12px; border-radius: 6px; font-size: 16px; color: #A09B8C;">Entrenamiento</div>
    </div>

    <div style="padding: 24px 32px; overflow: hidden;">
      <h1 style="margin: 0 0 4px; font-size: 20px; font-weight: 400;">Biblioteca</h1>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #63809F; margin-bottom: 20px;">19 partidas · 3 revisadas · 16 por revisar</div>

      <div style="display: grid; grid-template-columns: 42px 1fr repeat(5, 76px); gap: 12px; padding: 0 12px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #63809F;">
        <span></span><span>PARTIDA</span><span style="text-align: right;">PUESTO</span><span style="text-align: right;">KDA</span><span style="text-align: right;">ORO @15</span><span style="text-align: right;">DURACIÓN</span><span style="text-align: right;">APM</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{filas}}" as="f" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 42px 1fr repeat(5, 76px); gap: 12px; align-items: center; padding: 12px; background: #0D1A2E; border: 1px solid #16202E; border-radius: 6px;">
            <div style="width: 30px; height: 30px; border-radius: 9999px; background: #1B2839;"></div>
            <div style="min-width: 0;">
              <div style="font-size: 16px;">{{f.champ}}</div>
              <div style="display: flex; gap: 8px; align-items: baseline;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{f.color}};">{{f.res}}</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #63809F;">{{f.cuando}}</span>
              </div>
            </div>
            <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 16px;">{{f.puesto}}</div></div>
            <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 16px;">{{f.kda}}</div></div>
            <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 16px;">{{f.oro}}</div></div>
            <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 16px;">{{f.dur}}</div></div>
            <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 16px;">{{f.apm}}</div></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      filas: [
        { champ: 'Gwen', res: 'VICTORIA', color: '#3BA97D', cuando: 'hoy', puesto: '7º', kda: '9/3/12', oro: '+740', dur: '28:57', apm: '303' },
        { champ: 'Lillia', res: 'DERROTA', color: '#E84057', cuando: 'hoy', puesto: '4º', kda: '5/7/14', oro: '−320', dur: '34:21', apm: '271' },
        { champ: 'Gwen', res: 'VICTORIA', color: '#3BA97D', cuando: 'ayer', puesto: 'MVP', kda: '12/2/8', oro: '+2.1k', dur: '26:04', apm: '288' },
        { champ: 'Lillia', res: 'DERROTA', color: '#E84057', cuando: 'ayer', puesto: '8º', kda: '3/9/6', oro: '−1.4k', dur: '41:21', apm: '244' },
        { champ: 'Gwen', res: 'VICTORIA', color: '#3BA97D', cuando: 'hace 2d', puesto: '5º', kda: '7/4/11', oro: '+180', dur: '30:33', apm: '263' },
      ],
    };
  }
}
</script>
</body>
</html>
