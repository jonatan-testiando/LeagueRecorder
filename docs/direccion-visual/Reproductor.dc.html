<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #C8AA6E; } a:hover { color: #D9BE85; }
  </style>
</helmet>

<div style="width: 1240px; box-sizing: border-box; padding: 20px; background: #080D16; color: #EDEAE3;">

  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #7A8798; margin-bottom: 12px;">
    La cubierta del reproductor, en la dirección B
  </div>

  <div style="background: #0B1220; border: 1px solid #16202E; border-radius: 8px; padding: 12px 14px 16px;">

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
      <div style="display: flex; gap: 6px;">
        <div style="width: 26px; height: 26px; border-radius: 5px; background: #142033; display: grid; place-items: center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C6CBD3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></svg>
        </div>
        <div style="width: 26px; height: 26px; border-radius: 5px; background: #C8AA6E; display: grid; place-items: center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A1420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h4v16H6z"/><path d="M14 4h4v16h-4z"/></svg>
        </div>
        <div style="width: 26px; height: 26px; border-radius: 5px; background: #142033; display: grid; place-items: center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C6CBD3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg>
        </div>
      </div>

      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;">19:07</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7A8798;">/ 30:33</span>
      </div>

      <div style="display: flex; gap: 2px; padding: 2px; background: #0E1727; border-radius: 6px;">
        <span style="padding: 3px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7A8798;">0,5×</span>
        <span style="padding: 3px 8px; border-radius: 4px; background: #1B2A40; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;">1×</span>
        <span style="padding: 3px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7A8798;">2×</span>
      </div>

      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #7A8798;">APM</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;">263</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #7A8798;">Miradas</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #3BA97D;">9,8</span>
          <span style="font-size: 11px; color: #7A8798;">/min</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #7A8798;">Ciego</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #E84057;">02:00</span>
        </div>
      </div>
    </div>

    <div style="position: relative; height: 84px; background: #0E1727; border-radius: 6px; overflow: hidden;">
      <svg viewBox="0 0 1000 84" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;">
        <path d="M0 62 C 40 58, 70 44, 110 48 S 180 66, 220 52 S 300 34, 340 44 S 420 60, 470 40 S 560 30, 610 46 S 700 58, 760 42 S 860 36, 920 50 S 980 58, 1000 54 L 1000 84 L 0 84 Z" fill="rgba(59,169,125,0.10)"/>
        <path d="M0 62 C 40 58, 70 44, 110 48 S 180 66, 220 52 S 300 34, 340 44 S 420 60, 470 40 S 560 30, 610 46 S 700 58, 760 42 S 860 36, 920 50 S 980 58, 1000 54" fill="none" stroke="#3BA97D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
      </svg>

      <sc-for list="{{marcas}}" as="m" hint-placeholder-count="8">
        <div style="position: absolute; bottom: {{m.abajo}}; left: {{m.x}}; transform: translateX(-50%); width: 21px; height: 21px; border-radius: 9999px; border: 2px solid {{m.color}}; background: #0B1220; display: grid; place-items: center;">
          <span style="width: 7px; height: 7px; border-radius: 2px; background: {{m.color}};"></span>
        </div>
      </sc-for>

      <div style="position: absolute; left: 62%; top: 0; bottom: 0; width: 2px; background: #EDEAE3;"></div>

      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 11px;">
        <div style="position: absolute; left: 0; right: 0; top: 0; height: 3px;">
          <sc-for list="{{top}}" as="t" hint-placeholder-count="6">
            <span style="position: absolute; left: {{t}}; width: 2px; height: 3px; background: #C8AA6E;"></span>
          </sc-for>
        </div>
        <div style="position: absolute; left: 0; right: 0; top: 4px; height: 3px;">
          <sc-for list="{{mid}}" as="t" hint-placeholder-count="14">
            <span style="position: absolute; left: {{t}}; width: 2px; height: 3px; background: #3BA97D;"></span>
          </sc-for>
        </div>
        <div style="position: absolute; left: 0; right: 0; top: 8px; height: 3px;">
          <sc-for list="{{bot}}" as="t" hint-placeholder-count="9">
            <span style="position: absolute; left: {{t}}; width: 2px; height: 3px; background: #9B6DFF;"></span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7A8798;">
      <span>00:00</span><span>10:00</span><span>20:00</span><span>30:00</span>
    </div>

    <div style="display: flex; gap: 18px; margin-top: 10px; font-size: 11px; color: #7A8798;">
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 3px; background: #C8AA6E;"></span>Miradas a top</span>
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 3px; background: #3BA97D;"></span>a mid</span>
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 3px; background: #9B6DFF;"></span>a bot</span>
      <span style="margin-left: auto; color: #E84057;">El hueco de top entre 08:00 y 14:00 se ve solo</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const oro = '#C8AA6E', jade = '#3BA97D', rojo = '#E84057', violeta = '#9B6DFF';
    return {
      marcas: [
        { x: '8%', abajo: '30px', color: jade },
        { x: '17%', abajo: '30px', color: rojo },
        { x: '25%', abajo: '30px', color: oro },
        { x: '38%', abajo: '30px', color: jade },
        { x: '40%', abajo: '52px', color: jade },
        { x: '53%', abajo: '30px', color: rojo },
        { x: '62%', abajo: '30px', color: violeta },
        { x: '71%', abajo: '30px', color: jade },
        { x: '73%', abajo: '52px', color: rojo },
        { x: '88%', abajo: '30px', color: oro },
      ],
      top: ['3%', '6%', '11%', '19%', '52%', '58%', '71%', '84%', '92%'],
      mid: ['2%', '5%', '9%', '13%', '17%', '22%', '26%', '31%', '35%', '39%', '44%', '48%', '53%', '57%', '62%', '66%', '71%', '75%', '80%', '84%', '89%', '94%'],
      bot: ['4%', '10%', '16%', '24%', '30%', '37%', '45%', '55%', '63%', '70%', '78%', '86%', '95%'],
    };
  }
}
</script>
</body>
</html>
